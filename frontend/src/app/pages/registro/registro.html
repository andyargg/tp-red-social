<div class="pantalla-auth">
  <div class="card tarjeta-auth ancha">
    <div class="encabezado">
      <img src="favicon.svg" alt="" width="40" height="40" />
      <h1>Crear cuenta</h1>
      <p>Completá tus datos para sumarte a Socialito.</p>
    </div>

    <app-formulario-usuario
      textoBoton="Crear cuenta"
      textoEnviando="Creando cuenta…"
      [enviando]="enviando()"
      (enviado)="registrarse($event)"
    />

    <p class="alternativa">¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a></p>
  </div>
</div>
