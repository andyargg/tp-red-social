<div class="app">
  <aside class="sidebar">
    <a class="marca" routerLink="/publicaciones">
      <img src="favicon.svg" alt="" width="28" height="28" />
      <span>Social<span class="marca-ito">ito</span></span>
    </a>

    <nav>
      <a routerLink="/publicaciones" routerLinkActive="activo">
        <app-icono nombre="inicio" />Publicaciones
      </a>
      <a routerLink="/mi-perfil" routerLinkActive="activo">
        <app-icono nombre="usuario" />Mi perfil
      </a>
      <ng-container *appSoloAdmin>
        <p class="seccion">Administración</p>
        <a routerLink="/dashboard/usuarios" routerLinkActive="activo">
          <app-icono nombre="usuarios" />Usuarios
        </a>
        <a routerLink="/dashboard/estadisticas" routerLinkActive="activo">
          <app-icono nombre="grafico" />Estadísticas
        </a>
      </ng-container>
    </nav>

    <div class="pie">
      @if (auth.usuario(); as usuario) {
        <a class="quien" routerLink="/mi-perfil">
          <app-avatar
            [nombre]="usuario | nombreCompleto"
            [imagen]="usuario.imagenPerfil"
            tamanio="sm"
          />
          <span>
            <strong>{{ usuario | nombreCompleto }}</strong>
            <small>{{ '@' + usuario.nombreUsuario }}</small>
          </span>
        </a>
        <button type="button" class="salir" (click)="cerrarSesion()">
          <app-icono nombre="salir" />Cerrar sesión
        </button>
      }
    </div>
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
